# P1.2 BDD100K development cell. Select hyperparameters only on these three fixed seeds; rerun the
# chosen cell on the five confirmation seeds documented in P1.2.md.
defaults:
  - encoder: tiny
  - backbone: je
  - data: bdd
  - stream: regime
  - filter: accept_all
  - optim: adamw
  - init: from_scratch
  - _self_

img_size: 64
batch_size: 32
seed: 11
seeds: [11, 23, 37]
seed_split: dev
device: cpu
eval_every: 4
update_every: 1
train_scope: full
adapter_bottleneck: 16
teacher_retention_weight: 1.0

# The val split matches the promoted P1.0.2 corpus. Per-cell queries are capped, so sparse driving
# regimes remain usable while every reserved image stays disjoint from SSL training.
stream:
  support_per_canary: 25
  query_per_canary: 25
  era_query_per_cell: 5

bdd_root: /mnt/bdd100k
max_images: null
max_train_per_regime: 64
data:
  split: val
  min_canary_count: 50

well: null
pretrain_dir: outputs/pretrain
condition_probe: linear
condition_knn_k: 20
few_shot_counts: [1, 2, 5, 10, 20, 25]
run_name: bdd_je_adapt_vs_frozen

hydra:
  run:
    dir: outputs/adaptation-bdd/${now:%Y%m%d-%H%M%S}
  sweep:
    dir: outputs/adaptation-bdd/sweeps/${now:%Y%m%d-%H%M%S}
    subdir: ${train_scope}_r${teacher_retention_weight}_lr_${optim.lr}_u${update_every}
